<script>

function uploadFile() {
    const file = document.getElementById("fileInput").files[0];
    if (!file) return alert("Select file");

    const formData = new FormData();
    formData.append("file", file);

    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/upload");

    xhr.upload.onprogress = function (e) {
        if (e.lengthComputable) {
            const percent = Math.round((e.loaded / e.total) * 100);
            document.getElementById("progress").innerText = percent + "%";
        }
    };

    xhr.onload = function () {
        document.getElementById("status").innerText = "✅ Uploaded";
        loadMovies();
    };

    xhr.send(formData);
}

function loadMovies() {
    fetch("/files")
        .then(res => res.json())
        .then(files => {
            const list = document.getElementById("movieList");
            list.innerHTML = "";

            files.forEach(file => {
                const div = document.createElement("div");
                div.className = "movie";

                div.innerHTML = `
                    <p>${file.name}</p>

                    <button onclick="play('${file.id}')">▶ Play</button>

                    <button onclick="download('${file.id}')">⬇ Download</button>

                    <button onclick="deleteFile('${file.id}')">🗑 Delete</button>
                `;

                list.appendChild(div);
            });
        });
}

function play(id) {
    document.getElementById("player").src = "/video/" + id;
}

function download(id) {
    window.open("/download/" + id);
}

function deleteFile(id) {
    fetch("/delete/" + id, { method: "DELETE" })
        .then(() => loadMovies());
}

loadMovies();

</script>
