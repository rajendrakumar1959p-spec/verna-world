<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: #111;
            color: white;
            text-align: center;
        }

        h1 {
            background: black;
            padding: 15px;
        }

        .movie-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .movie {
            background: #222;
            margin: 10px;
            padding: 15px;
            border-radius: 10px;
            width: 200px;
        }

        button {
            margin: 5px;
            padding: 8px;
            border: none;
            background: #444;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #666;
        }
    </style>
</head>

<body>

<h1>🎬 Verna World Dashboard</h1>

<input type="file" id="fileInput">
<button onclick="uploadFile()">Upload</button>

<p id="progress"></p>
<p id="status"></p>

<div class="movie-list" id="movieList"></div>

<br>

<video id="player" controls width="500"></video>

<script>

const BASE_URL = "https://verna-world.onrender.com"; // 🔥 IMPORTANT

function uploadFile() {
    const file = document.getElementById("fileInput").files[0];
    if (!file) return alert("Select file");

    const formData = new FormData();
    formData.append("file", file);

    const xhr = new XMLHttpRequest();
    xhr.open("POST", BASE_URL + "/upload");

    xhr.upload.onprogress = function (e) {
        if (e.lengthComputable) {
            const percent = Math.round((e.loaded / e.total) * 100);
            document.getElementById("progress").innerText = percent + "%";
        }
    };

    xhr.onload = function () {
        document.getElementById("status").innerText = "✅ Uploaded";
        loadMovies();
    };

    xhr.onerror = function () {
        document.getElementById("status").innerText = "❌ Upload Failed";
    };

    xhr.send(formData);
}

function loadMovies() {
    fetch(BASE_URL + "/files")
        .then(res => res.json())
        .then(files => {
            const list = document.getElementById("movieList");
            list.innerHTML = "";

            files.forEach(file => {
                const div = document.createElement("div");
                div.className = "movie";

                div.innerHTML = `
                    <p>${file.name}</p>

                    <button onclick="play('${file.id}')">▶ Play</button>

                    <button onclick="download('${file.id}')">⬇ Download</button>

                    <button onclick="deleteFile('${file.id}')">🗑 Delete</button>
                `;

                list.appendChild(div);
            });
        })
        .catch(err => {
            console.error(err);
            document.body.innerHTML = "❌ Backend not responding";
        });
}

function play(id) {
    document.getElementById("player").src = BASE_URL + "/video/" + id;
}

function download(id) {
    window.open(BASE_URL + "/download/" + id);
}

function deleteFile(id) {
    fetch(BASE_URL + "/delete/" + id, { method: "DELETE" })
        .then(() => loadMovies());
}

// 🔥 Render sleep fix
setTimeout(loadMovies, 2000);

</script>

</body>
</html>
