<!DOCTYPE html>
<html>
<head>
<title>Verna World</title>

<style>
body {
    font-family: Arial;
    background: #111;
    color: white;
    text-align: center;
}

h1 {
    background: black;
    padding: 15px;
}

.movie-list {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}

.movie {
    background: #222;
    margin: 10px;
    padding: 15px;
    border-radius: 10px;
    width: 200px;
}

button {
    padding: 8px;
    margin-top: 5px;
    background: red;
    border: none;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}

video {
    margin-top: 20px;
    max-width: 90%;
}
</style>
</head>

<body>

<h1>🎬 VERNA WORLD</h1>

<h2>Upload File</h2>

<input type="file" id="fileInput">
<button onclick="uploadFile()">Upload</button>

<br><br>

<div id="progressBox" style="width:300px; background:#333; margin:auto; display:none;">
    <div id="progressBar" style="height:20px; width:0%; background:red;"></div>
</div>

<p id="status"></p>

<h2>Files</h2>

<div class="movie-list" id="movieList"></div>

<video id="player" controls></video>

<script>

// 📤 Upload with progress
function uploadFile() {
    const file = document.getElementById("fileInput").files[0];
    if (!file) return alert("Select a file");

    const formData = new FormData();
    formData.append("file", file);

    const xhr = new XMLHttpRequest();

    document.getElementById("progressBox").style.display = "block";

    const startTime = new Date().getTime();

    xhr.upload.onprogress = function(e) {
        if (e.lengthComputable) {
            const percent = (e.loaded / e.total) * 100;
            document.getElementById("progressBar").style.width = percent + "%";
            document.getElementById("status").innerText =
                "Uploading: " + Math.round(percent) + "%";
        }
    };

    xhr.onload = function() {
        const endTime = new Date().getTime();
        const seconds = ((endTime - startTime) / 1000).toFixed(2);

        document.getElementById("status").innerText =
            "✅ Upload Complete in " + seconds + " sec";

        setTimeout(() => location.reload(), 1500);
    };

    xhr.open("POST", "/upload", true);
    xhr.send(formData);
}

// 📂 Load files
fetch('/files')
.then(res => res.json())
.then(data => {
    const list = document.getElementById("movieList");

    data.forEach(file => {
        const div = document.createElement("div");
        div.className = "movie";

        div.innerHTML = `
            <p>${file}</p>
            <button onclick="playVideo('${file}')">▶ Play</button>
            <a href="/download/${file}">
                <button>⬇ Download</button>
            </a>
        `;

        list.appendChild(div);
    });
});

// 🎬 Play video
function playVideo(name) {
    document.getElementById("player").src = "/video/" + name;
}

</script>

</body>
</html>
