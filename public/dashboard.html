<!DOCTYPE html>
<html>
<head>
<title>Verna World</title>

<style>
body {
    font-family: Arial;
    background: #111;
    color: white;
    text-align: center;
}

h1 {
    background: black;
    padding: 15px;
}

.movie-list {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}

.movie {
    background: #222;
    margin: 10px;
    padding: 15px;
    border-radius: 10px;
    width: 220px;
}

button {
    padding: 8px;
    margin-top: 5px;
    background: red;
    border: none;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}

iframe {
    margin-top: 20px;
    max-width: 90%;
    border-radius: 10px;
}
</style>
</head>

<body>

<h1>🎬 VERNA WORLD</h1>

<h2>Upload to Google Drive</h2>

<input type="file" id="fileInput">
<button onclick="uploadFile()">Upload</button>

<br><br>

<div id="progressBox" style="width:300px; background:#333; margin:auto; display:none;">
    <div id="progressBar" style="height:20px; width:0%; background:red;"></div>
</div>

<p id="status"></p>

<h2>Drive Files</h2>

<div class="movie-list" id="movieList"></div>

<iframe id="player" width="700" height="400" allow="autoplay"></iframe>

<script>

// Upload with progress
function uploadFile() {
    const file = document.getElementById("fileInput").files[0];
    if (!file) return alert("Select file");

    const formData = new FormData();
    formData.append("file", file);

    const xhr = new XMLHttpRequest();

    document.getElementById("progressBox").style.display = "block";

    xhr.upload.onprogress = function(e) {
        if (e.lengthComputable) {
            const percent = (e.loaded / e.total) * 100;
            document.getElementById("progressBar").style.width = percent + "%";
            document.getElementById("status").innerText =
                "Uploading: " + Math.round(percent) + "%";
        }
    };

    xhr.onload = function() {
        document.getElementById("status").innerText = "Upload Done ✔";
        setTimeout(() => location.reload(), 1000);
    };

    xhr.open("POST", "/upload", true);
    xhr.send(formData);
}

// Load files
fetch('/files')
.then(res => res.json())
.then(data => {
    const list = document.getElementById("movieList");

    data.forEach(file => {
        const div = document.createElement("div");
        div.className = "movie";

        div.innerHTML = `
            <p>${file.name}</p>

            <button onclick="play('${file.id}')">▶ Play</button>

            <a href="/download/${file.id}">
                <button>⬇ Download</button>
            </a>

            <button onclick="deleteFile('${file.id}')">🗑 Delete</button>
        `;

        list.appendChild(div);
    });
});

// Play video
function play(id) {
    document.getElementById("player").src =
        "https://drive.google.com/uc?export=preview&id=" + id;
}

// Delete
function deleteFile(id) {
    fetch('/delete/' + id, { method: 'DELETE' })
    .then(() => location.reload());
}

</script>

</body>
</html>
