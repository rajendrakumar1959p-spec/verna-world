<!DOCTYPE html>
<html>
<head>
    <title>Verna World</title>

    <style>
        body {
            font-family: Arial;
            background: #111;
            color: white;
            margin: 0;
            text-align: center;
        }

        h1 {
            background: black;
            padding: 15px;
        }

        .upload-box {
            margin: 20px;
        }

        .movie-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .movie {
            background: #222;
            margin: 10px;
            padding: 15px;
            border-radius: 10px;
            width: 180px;
        }

        .movie button {
            margin-top: 5px;
            width: 100%;
        }

        button {
            padding: 8px;
            border: none;
            background: red;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        video {
            margin-top: 20px;
            max-width: 90%;
        }
    </style>
</head>

<body>

<h1>🎬 VERNA WORLD</h1>

<div class="upload-box">
    <h2>Upload File</h2>

    <form action="/upload" method="POST" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <button type="submit">Upload</button>
    </form>
</div>

<h2>Files</h2>

<div class="movie-list" id="movieList"></div>

<video id="player" controls></video>

<script>

fetch('/files')
.then(res => res.json())
.then(data => {
    const list = document.getElementById("movieList");

    data.forEach(file => {
        const div = document.createElement("div");
        div.className = "movie";

        div.innerHTML = `
            <p>${file}</p>
            <button onclick="playVideo('${file}')">▶ Play</button>
            <a href="/download/${file}">
                <button>⬇ Download</button>
            </a>
        `;

        list.appendChild(div);
    });
});

function playVideo(name) {
    document.getElementById("player").src = "/video/" + name;
}

</script>

</body>
</html>
